<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>گراتولز | دایرکتوری ابزارهای رایگان وب</title>
<meta name="description" content="مجموعه‌ای منتخب و رایگان از بهترین ابزارهای طراحی، گرافیک و توسعه وب">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0060ff">
<link rel="icon" type="image/svg+xml" href="assets/logo/logo.svg">
<link rel="apple-touch-icon" href="assets/icons/icon-512.png">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar" aria-label="دسته‌بندی‌ها">
    <a class="logo" href="./" aria-label="گراتولز">
      <img class="logo-light" src="assets/logo/logo.svg" alt="گراتولز">
      <img class="logo-dark" src="assets/logo/logo-dark.svg" alt="">
    </a>
    <div id="sideNav"></div>
    <div class="nav-group-title">بیشتر</div>
    <button type="button" class="nav-item" id="aboutBtn">
      <span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 8h.01"></path></svg></span>
      <span class="nav-label">درباره ما</span>
    </button>
    <a class="nav-item" href="https://github.com/armvnhs/Gratools/issues/new?template=suggest-tool.yml" target="_blank" rel="noopener noreferrer">
      <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"></path></svg></span>
      <span class="nav-label">پیشنهاد ابزار</span>
    </a>
  </aside>

  <div class="main">
    <div class="topbar">
      <a class="logo logo-mobile" href="./" aria-label="گراتولز">
        <img class="logo-light" src="assets/logo/logo.svg" alt="گراتولز">
        <img class="logo-dark" src="assets/logo/logo-dark.svg" alt="">
      </a>
      <button class="round-btn" id="themeToggle" aria-label="تغییر حالت روشن و تاریک">
        <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path></svg>
        <svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
      </button>
    </div>


    <label class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg>
      <input type="search" id="searchInput" placeholder="جستجو در ابزارها..." autocomplete="off">
    </label>

    <div class="mobile-cats" id="mobileCats"></div>

    <div class="grid" id="toolsGrid" aria-live="polite">
      <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
    </div>

    <footer>
      <span>© ۱۴۰۴ گراتولز</span>
      <a href="https://github.com/armvnhs/Gratools" target="_blank" rel="noopener noreferrer">گیت‌هاب</a>
    </footer>
  </div>
</div>

<div class="modal" id="aboutModal" role="dialog" aria-modal="true" aria-labelledby="aboutTitle">
  <div class="modal-box">
    <button class="round-btn" id="aboutClose" aria-label="بستن">
      <svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"></path></svg>
    </button>
    <img class="logo-light" src="assets/logo/logo.svg" alt="">
    <img class="logo-dark" src="assets/logo/logo-dark.svg" alt="">
    <h3 id="aboutTitle">درباره ما</h3>
    <p>سلام! من سازنده <strong>گراتولز</strong> هستم. این پروژه را با این آرمان ساختم که دسترسی به ابزارهای رایگان و کاربردی وب برای همه ساده‌تر باشد.</p>
    <p>گراتولز یک پروژه متن‌باز است و با کمک پیشنهادهای شما در گیت‌هاب، روزبه‌روز کامل‌تر می‌شود.</p>
  </div>
</div>
<script src="assets/js/app.js"></script>
</body>
</html>
