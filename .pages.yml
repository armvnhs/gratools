media:
  - name: logo
    input: assets/logo
    output: /assets/logo
  - name: tools
    input: assets/tools
    output: assets/tools

content:
  - name: tools
    label: Tools
    type: file
    path: data/sites.json
    format: json
    fields:
      - name: tools
        label: Tools list
        type: object
        list:
          collapsible:
            state: collapsed
            summary: "{fields.name}"
        fields:
          - name: name
            label: Name
            type: string
            required: true
          - name: url
            label: Website URL
            type: string
            required: true
            pattern:
              regex: '^https://'
              message: URL must start with https://
          - name: description
            label: Description
            type: text
            required: true
          - name: category
            label: Category
            type: select
            required: true
            options:
              values:
                - { value: graphic, label: Design & Graphics }
                - { value: dev, label: Development & Code }
                - { value: converter, label: File Converters }
                - { value: productivity, label: Productivity }
          - name: popular
            label: Popular
            type: boolean
            default: false
          - name: icon
            label: Icon (optional, square, at least 128px)
            type: image
            options:
              media: tools
              extensions: [png, svg, webp, jpg]
